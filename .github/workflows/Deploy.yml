name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Zine
        run: |
          curl --fail --location --retry 3 \
            https://github.com/kristoff-it/zine/releases/download/v0.14.1/x86_64-linux-musl.tar.xz \
            --output "$RUNNER_TEMP/zine.tar.xz"
          echo "c04c718db69f160716fd6c78154642eb1eab0b842e72d80ea05765340d5c9dbe  $RUNNER_TEMP/zine.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zine"
          tar -xJf "$RUNNER_TEMP/zine.tar.xz" -C "$RUNNER_TEMP/zine"
          echo "$RUNNER_TEMP/zine" >> "$GITHUB_PATH"
      - name: Build site
        run: zine release
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: public
